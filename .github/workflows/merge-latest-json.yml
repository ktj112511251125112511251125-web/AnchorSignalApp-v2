name: Merge latest JSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download UPRO JSON
        run: |
          curl -L \
            https://raw.githubusercontent.com/ktj112511251125112511251125-web/UPRO-anchor-dashboard/main/upro_latest.json \
            -o upro_latest.json

      - name: Download DUAL JSON
        run: |
          curl -L \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer ${{ secrets.DUAL_REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ktj112511251125112511251125-web/dual-anchor-dashboard/contents/dual_latest.json \
            -o dual_latest.json

      - name: Merge JSON files
        run: |
          mkdir -p app_data
          python scripts/merge_latest.py \
            --upro upro_latest.json \
            --dual dual_latest.json \
            --output app_data/latest.json

      - name: Commit merged latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_data/latest.json
          git diff --cached --quiet || git commit -m "chore: update latest.json"
          git push
