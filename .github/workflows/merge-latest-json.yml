name: Merge latest JSON

on:
  workflow_dispatch:
  repository_dispatch:
    types: [anchor-source-updated]

permissions:
  contents: write

concurrency:
  group: anchor-latest-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AnchorSignalApp
        uses: actions/checkout@v4

      - name: Download latest source JSON files
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.DUAL_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/anchor-json app_data

          curl --fail --silent --show-error -L \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer $SOURCE_REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ktj112511251125112511251125-web/UPRO-anchor-dashboard/contents/upro_latest.json \
            -o /tmp/anchor-json/upro_latest.json

          curl --fail --silent --show-error -L \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer $SOURCE_REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ktj112511251125112511251125-web/dual-anchor-dashboard/contents/dual_latest.json \
            -o /tmp/anchor-json/dual_latest.json

          python -m json.tool /tmp/anchor-json/upro_latest.json >/dev/null
          python -m json.tool /tmp/anchor-json/dual_latest.json >/dev/null

      - name: Merge UPRO + QLD + TQQQ
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          with open('/tmp/anchor-json/upro_latest.json', encoding='utf-8') as f:
              upro = json.load(f)
          with open('/tmp/anchor-json/dual_latest.json', encoding='utf-8') as f:
              dual = json.load(f)

          assets = []
          for source in (upro, dual):
              if isinstance(source, dict) and isinstance(source.get('assets'), list):
                  assets.extend(source['assets'])
              elif isinstance(source, dict) and (source.get('symbol') or source.get('ticker')):
                  assets.append(source)

          order = {'UPRO': 0, 'QLD': 1, 'TQQQ': 2}
          def symbol(item):
              return str(item.get('symbol') or item.get('ticker') or '').upper()
          assets.sort(key=lambda item: order.get(symbol(item), 99))

          if not assets:
              raise RuntimeError('No assets found in source JSON files')

          payload = {
              'updated_at': datetime.now(timezone.utc).isoformat(),
              'market_label': 'Anchor 실제 전략 신호',
              'market_detail': 'UPRO + QLD/TQQQ 자동 병합',
              'assets': assets,
          }

          out = Path('app_data/latest.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          print('Created:', out)
          print('Symbols:', [symbol(x) for x in assets])
          PY

      - name: Commit latest.json when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_data/latest.json
          if git diff --cached --quiet; then
            echo "No JSON change"
          else
            git commit -m "chore: update latest.json"
            git push
          fi
