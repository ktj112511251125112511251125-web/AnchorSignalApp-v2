name: Merge latest JSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source JSON files
        env:
          REPO_TOKEN: ${{ secrets.DUAL_REPO_TOKEN }}
        run: |
          mkdir -p /tmp/anchor-json

          curl --fail -L \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer $REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ktj112511251125112511251125-web/UPRO-anchor-dashboard/contents/upro_latest.json \
            -o /tmp/anchor-json/upro_latest.json

          curl --fail -L \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer $REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ktj112511251125112511251125-web/dual-anchor-dashboard/contents/dual_latest.json \
            -o /tmp/anchor-json/dual_latest.json

          echo "UPRO bytes:"
          wc -c /tmp/anchor-json/upro_latest.json

          echo "DUAL bytes:"
          wc -c /tmp/anchor-json/dual_latest.json

      - name: Merge latest JSON
        run: |
          mkdir -p app_data

          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          upro_path = Path("/tmp/anchor-json/upro_latest.json")
          dual_path = Path("/tmp/anchor-json/dual_latest.json")

          with upro_path.open("r", encoding="utf-8") as f:
              upro = json.load(f)

          with dual_path.open("r", encoding="utf-8") as f:
              dual = json.load(f)

          assets = []

          if isinstance(upro, dict):
              if isinstance(upro.get("assets"), list):
                  assets.extend(upro["assets"])
              elif upro.get("symbol") or upro.get("ticker"):
                  assets.append(upro)

          if isinstance(dual, dict):
              if isinstance(dual.get("assets"), list):
                  assets.extend(dual["assets"])
              elif dual.get("symbol") or dual.get("ticker"):
                  assets.append(dual)

          if not assets:
              raise RuntimeError("No assets found in UPRO/DUAL JSON")

          def symbol_of(item):
              return str(
                  item.get("symbol")
                  or item.get("ticker")
                  or ""
              ).upper()

          order = {
              "UPRO": 0,
              "QLD": 1,
              "TQQQ": 2
          }

          assets.sort(
              key=lambda item: order.get(symbol_of(item), 99)
          )

          payload = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "market_label": "Anchor 실제 전략 신호",
              "market_detail": "UPRO + QLD/TQQQ 자동 병합",
              "assets": assets
          }

          out = Path("app_data/latest.json")

          out.write_text(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("Created:", out)
          print("Asset count:", len(assets))
          print("Symbols:", [symbol_of(x) for x in assets])
          PY

      - name: Commit latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app_data/latest.json

          if git diff --cached --quiet; then
            echo "No JSON changes"
          else
            git commit -m "chore: update latest.json"
            git push
          fi
