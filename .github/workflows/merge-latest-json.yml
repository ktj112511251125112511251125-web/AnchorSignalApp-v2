name: Merge latest JSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge latest JSON
        env:
          UPRO_JSON_URL: https://raw.githubusercontent.com/ktj112511251125112511251125-web/UPRO-anchor-dashboard/main/upro_latest.json
          DUAL_REPO_TOKEN: ${{ secrets.DUAL_REPO_TOKEN }}
        run: |
          mkdir -p app_data

          curl -L \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer $DUAL_REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ktj112511251125112511251125-web/dual-anchor-dashboard/contents/dual_latest.json \
            -o /tmp/dual_latest.json

          curl -L \
            "$UPRO_JSON_URL" \
            -o /tmp/upro_latest.json

          python -c '
          import json
          from pathlib import Path
          from datetime import datetime

          upro = json.load(open("/tmp/upro_latest.json", encoding="utf-8"))
          dual = json.load(open("/tmp/dual_latest.json", encoding="utf-8"))

          assets = upro.get("assets", []) + dual.get("assets", [])

          if not assets:
              raise RuntimeError("No assets found in source JSON files")

          order = {"UPRO": 0, "QLD": 1, "TQQQ": 2}
          assets.sort(key=lambda x: order.get(str(x.get("symbol", "")), 99))

          payload = {
              "updated_at": datetime.now().astimezone().strftime("%Y-%m-%d %H:%M %Z"),
              "market_label": "Anchor 실제 전략 신호",
              "market_detail": "UPRO + QLD/TQQQ GitHub Actions 결과 자동 병합",
              "assets": assets
          }

          Path("app_data").mkdir(exist_ok=True)
          Path("app_data/latest.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("latest.json created:", len(assets), "assets")
          '

      - name: Commit latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_data/latest.json
          git diff --cached --quiet || git commit -m "chore: update latest.json"
          git push
