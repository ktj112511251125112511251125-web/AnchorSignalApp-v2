name: Merge Anchor latest.json

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-5"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Merge UPRO + DUAL JSON
        env:
          UPRO_JSON_URL: ${{ vars.UPRO_JSON_URL }}
          DUAL_JSON_URL: ${{ vars.DUAL_JSON_URL }}
        run: python scripts/merge_latest.py
      - name: Commit latest.json when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_data/latest.json
          if git diff --cached --quiet; then
            echo "No JSON change"
          else
            git commit -m "chore: update Anchor latest.json"
            git push
          fi
