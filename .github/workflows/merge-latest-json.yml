name: Merge latest JSON

on:
  workflow_dispatch:
  repository_dispatch:
    types: [anchor-source-updated]

permissions:
  contents: write

concurrency:
  group: anchor-latest-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AnchorSignalApp
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install valuation data dependencies
        run: python -m pip install --disable-pip-version-check yfinance requests

      - name: Download latest source JSON files
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.DUAL_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/anchor-json app_data

          curl --fail --silent --show-error -L \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer $SOURCE_REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ktj112511251125112511251125-web/UPRO-anchor-dashboard/contents/upro_latest.json \
            -o /tmp/anchor-json/upro_latest.json

          curl --fail --silent --show-error -L \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer $SOURCE_REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ktj112511251125112511251125-web/dual-anchor-dashboard/contents/dual_latest.json \
            -o /tmp/anchor-json/dual_latest.json

          python -m json.tool /tmp/anchor-json/upro_latest.json >/dev/null
          python -m json.tool /tmp/anchor-json/dual_latest.json >/dev/null

      - name: Merge + enrich strategy conditions
        env:
          UPRO_JSON_FILE: /tmp/anchor-json/upro_latest.json
          DUAL_JSON_FILE: /tmp/anchor-json/dual_latest.json
          LATEST_JSON_PATH: app_data/latest.json
          VALUATION_HISTORY_PATH: app_data/valuation_history.json
          QQQ_FORWARD_PE: ${{ vars.QQQ_FORWARD_PE }}
          QQQ_FORWARD_PE_AS_OF: ${{ vars.QQQ_FORWARD_PE_AS_OF }}
          VOO_FORWARD_PE: ${{ vars.VOO_FORWARD_PE }}
          VOO_FORWARD_PE_AS_OF: ${{ vars.VOO_FORWARD_PE_AS_OF }}
          US10Y: ${{ vars.US10Y }}
          US10Y_AS_OF: ${{ vars.US10Y_AS_OF }}
          FED_FUNDS_LOWER: ${{ vars.FED_FUNDS_LOWER }}
          FED_FUNDS_LOWER_AS_OF: ${{ vars.FED_FUNDS_LOWER_AS_OF }}
          FED_FUNDS_UPPER: ${{ vars.FED_FUNDS_UPPER }}
          FED_FUNDS_UPPER_AS_OF: ${{ vars.FED_FUNDS_UPPER_AS_OF }}
        run: python scripts/merge_latest.py

      - name: Commit latest.json when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_data/latest.json
          if [ -f app_data/valuation_history.json ]; then git add app_data/valuation_history.json; fi
          if git diff --cached --quiet; then
            echo "No JSON change"
          else
            git commit -m "chore: update latest.json"
            git push
          fi
